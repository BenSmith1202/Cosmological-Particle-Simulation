<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Sim — Cosmological Particle-Mesh Simulation</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #ccc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas#celestial-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      line-height: 1.5;
    }
    #status code {
      background: #1e1e1e;
      padding: 2px 6px;
      border-radius: 4px;
      color: #9cdcfe;
    }
  </style>
</head>
<body>
  <div id="status">Loading Celestial Sim (WebAssembly + WebGPU)...</div>
  <canvas id="celestial-canvas" tabindex="0"></canvas>
  <script>
    (function () {
      const status = document.getElementById("status");
      const canvas = document.getElementById("celestial-canvas");
      if (canvas) {
        canvas.focus();
        window.addEventListener("pointerdown", function () {
          canvas.focus();
        });
        window.addEventListener("keydown", function (e) {
          if (document.activeElement !== canvas) {
            canvas.focus();
            canvas.dispatchEvent(new KeyboardEvent("keydown", e));
          }
        });
      }
      if (!navigator.gpu) {
        status.innerHTML =
          "<strong>WebGPU is not enabled in this browser.</strong><br/>" +
          "Please open this page in Chrome 113+, Edge 113+, or Safari 18+ with WebGPU enabled.";
        return;
      }
      setTimeout(function () {
        if (document.querySelector("link[data-trunk]")) {
          status.innerHTML =
            "<strong>Uncompiled <code>index.html</code> detected.</strong><br/>" +
            "GitHub Pages is serving the raw source branch instead of the compiled WebAssembly bundle.<br/>" +
            "In your GitHub repository, go to <strong>Settings &rarr; Pages &rarr; Build and deployment &rarr; Source</strong> and select <strong>GitHub Actions</strong>.";
        }
      }, 2500);
    })();
  </script>
</body>
</html>
